# Publishes the SDKs that live in this repo (Node, CLI, Python) automatically when
# their version changes on main. Bump "version" in sdks/node/package.json,
# sdks/cli/package.json or sdks/python/setup.py to release; other changes publish
# nothing. The other SDKs live in their own repos and publish themselves the same way.
name: Release SDKs

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-sdks
  cancel-in-progress: false

jobs:
  npm:
    name: npm ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: "@jobcelis/sdk"
            dir: sdks/node
          - package: "@jobcelis/cli"
            dir: sdks/cli
    # npm trusted publishing: npmjs.com trusts this workflow, no token needed
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # trusted publishing needs npm 11.5.1+, which ships with Node 24
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Already released?
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${{ matrix.package }}@$VERSION" version >/dev/null 2>&1; then
            echo "${{ matrix.package }}@$VERSION is already published: nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.check.outputs.release == 'true'
        run: npm install && npm run build

      - name: Publish
        if: steps.check.outputs.release == 'true'
        run: npm publish --access public

  pypi:
    name: PyPI jobcelis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Already released?
        id: check
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          VERSION=$(grep -m1 -oE 'version="[^"]+"' setup.py | cut -d'"' -f2)
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/jobcelis/$VERSION/json")
          if [ -z "$PYPI_TOKEN" ]; then
            echo "::warning::Not publishing: add the PYPI_TOKEN repository secret."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [ "$CODE" = "200" ]; then
            echo "jobcelis $VERSION is already on PyPI: nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.check.outputs.release == 'true'
        run: pip install build twine && python -m build

      - name: Publish
        if: steps.check.outputs.release == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*
