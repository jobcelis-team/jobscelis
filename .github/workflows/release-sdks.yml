# Publishes the SDKs that live in this repo (Node, CLI, Python) on every push to
# main that changes them:
#   1. next-version (jobcelis-team/.github) picks the version: the last release
#      tag plus a patch, or the version in the manifest when it was raised by hand
#      (sdks/node/package.json, sdks/cli/package.json, sdks/python/setup.py).
#      Docs, tests and CI release nothing.
#   2. writes it into the manifest for the build (main is protected, so it is not
#      committed: the version lives in the node-vX.Y.Z, cli-vX.Y.Z, python-vX.Y.Z tags)
#   3. builds and publishes it, then tags the commit
# The other SDKs live in their own repos and publish themselves the same way.
name: Release SDKs

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-sdks
  cancel-in-progress: false

jobs:
  npm:
    name: npm ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: "@jobcelis/sdk"
            dir: sdks/node
            tag: node
          - package: "@jobcelis/cli"
            dir: sdks/cli
            tag: cli
    # npm trusted publishing: npmjs.com trusts this workflow, no token needed
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
        with:
          # full history and tags: next-version compares with the last release
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # trusted publishing needs npm 11.5.1+, which ships with Node 24
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Read version
        id: current
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Next version
        id: v
        uses: jobcelis-team/.github/actions/next-version@main
        with:
          current: ${{ steps.current.outputs.version }}
          tag-prefix: ${{ matrix.tag }}-v
          scope: ${{ matrix.dir }}

      - name: Write the version
        if: steps.v.outputs.release == 'true'
        run: npm version "${{ steps.v.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Already released?
        id: check
        if: steps.v.outputs.release == 'true'
        run: |
          if npm view "${{ matrix.package }}@${{ steps.v.outputs.version }}" version >/dev/null 2>&1; then
            echo "${{ matrix.package }}@${{ steps.v.outputs.version }} is already published"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.check.outputs.release == 'true'
        run: npm install && npm run build

      - name: Publish
        if: steps.check.outputs.release == 'true'
        run: npm publish --access public

      - name: Tag the release
        if: steps.v.outputs.release == 'true' && (steps.check.outputs.release == 'true' || steps.check.outputs.published == 'true')
        uses: jobcelis-team/.github/actions/push-release@main
        with:
          tag: ${{ steps.v.outputs.tag }}
          push-commit: "false"

  pypi:
    name: PyPI jobcelis
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4
        with:
          # full history and tags: next-version compares with the last release
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        id: current
        run: echo "version=$(grep -m1 -oE 'version="[^"]+"' setup.py | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Next version
        id: v
        uses: jobcelis-team/.github/actions/next-version@main
        with:
          current: ${{ steps.current.outputs.version }}
          tag-prefix: python-v
          scope: sdks/python

      - name: Write the version
        if: steps.v.outputs.release == 'true'
        run: sed -i -E 's/version="[^"]+"/version="${{ steps.v.outputs.version }}"/' setup.py

      - name: Already released?
        id: check
        if: steps.v.outputs.release == 'true'
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/jobcelis/$VERSION/json")
          if [ "$CODE" = "200" ]; then
            echo "jobcelis $VERSION is already on PyPI"
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$PYPI_TOKEN" ]; then
            echo "::warning::Not publishing: add the PYPI_TOKEN repository secret."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.check.outputs.release == 'true'
        run: pip install build twine && python -m build

      - name: Publish
        if: steps.check.outputs.release == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*

      - name: Tag the release
        if: steps.v.outputs.release == 'true' && (steps.check.outputs.release == 'true' || steps.check.outputs.published == 'true')
        uses: jobcelis-team/.github/actions/push-release@main
        with:
          tag: ${{ steps.v.outputs.tag }}
          push-commit: "false"
