name: CI

on:
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "sdks/**"
      - "LICENSE"
      - "VERSION"
      - ".github/workflows/release-sdks.yml"
      - ".github/workflows/release.yml"

# Read-only token: no job writes to the repository
permissions:
  contents: read

# A new push to a pull request cancels its run still in progress
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.20.4"
  OTP_VERSION: "29"

jobs:
  # The same code is not tested twice. After a pull request is merged into
  # develop, the develop -> main pull request usually contains exactly the
  # tree that was already tested; a successful run records the tree it tested
  # (artifact tested-tree-<hash>), and a later run of the same tree skips the
  # jobs below. Skipped jobs count as passed for required checks. Any
  # difference in the code runs everything.
  tested:
    name: Already tested?
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tree: ${{ steps.tree.outputs.tree }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v7

      - name: Tree being tested
        id: tree
        run: echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Look for a successful run of the same tree
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ steps.tree.outputs.tree }}
        run: |
          if ! resp=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=tested-tree-${TREE}" 2>&1); then
            echo "Artifact lookup failed, running everything: $resp"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          found=$(echo "$resp" | jq '[.artifacts[] | select(.expired == false)] | length')
          echo "Successful runs found for tree ${TREE}: ${found}"
          if [ "${found:-0}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  compile:
    name: Compile & Format
    runs-on: ubuntu-latest
    needs: tested
    if: needs.tested.outputs.skip != 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      # Compiled deps and app from the compile job of this commit (or the
      # closest earlier build), so nothing is compiled twice
      - name: Restore build
        uses: actions/cache/restore@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      # One cache per commit: the next build restores it and only recompiles
      # what changed, and the jobs below reuse it as is
      - name: Save build
        uses: actions/cache/save@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}-${{ github.sha }}

      - name: Check formatting
        run: mix format --check-formatted

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    needs: [tested, compile]
    if: needs.tested.outputs.skip != 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      # Compiled deps and app from the compile job of this commit (or the
      # closest earlier build), so nothing is compiled twice
      - name: Restore build
        uses: actions/cache/restore@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Run Credo
        run: mix credo --min-priority=high

      - name: Run Sobelow (security)
        run: mix sobelow --exit low --root apps/streamflix_web --skip

      - name: Audit dependencies (CVEs)
        run: mix deps.audit

      - name: Check retired packages
        run: mix hex.audit

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [tested, compile]
    if: needs.tested.outputs.skip != 'true'
    services:
      postgres:
        image: postgres:16-alpine
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: streamflix_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: ecto://postgres:postgres@localhost:5432/streamflix_test
    steps:
      - uses: actions/checkout@v7

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      # Compiled deps and app from the compile job of this commit (or the
      # closest earlier build), so nothing is compiled twice
      - name: Restore build
        uses: actions/cache/restore@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Setup database
        run: mix ecto.create && mix ecto.migrate

      - name: Run tests
        run: mix test

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    needs: [tested, compile]
    if: needs.tested.outputs.skip != 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      # Compiled deps and app from the compile job of this commit (or the
      # closest earlier build), so nothing is compiled twice
      - name: Restore build
        uses: actions/cache/restore@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}-

      # PLTs (OTP, Elixir and deps) take minutes to build: kept in priv/plts
      # and cached per OTP/Elixir/lockfile
      - name: Restore Dialyzer PLT
        id: plt
        uses: actions/cache/restore@v6
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Build PLT
        if: steps.plt.outputs.cache-hit != 'true'
        run: mkdir -p priv/plts && mix dialyzer --plt

      # Saved right after building, so a later warning cannot lose it
      - name: Save Dialyzer PLT
        if: steps.plt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: priv/plts
          key: ${{ steps.plt.outputs.cache-primary-key }}

      - name: Run Dialyzer
        run: mix dialyzer --format github

  container-security:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: tested
    if: needs.tested.outputs.skip != 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Reuses the layers cached by the deploys (and by earlier runs of this
      # branch): only the layers after a change are rebuilt
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          load: true
          tags: jobscelis:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'jobscelis:ci'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

  # Records the tree that just passed every job (see "Already tested?")
  record-tested:
    name: Record tested tree
    runs-on: ubuntu-latest
    needs: [tested, compile, static-analysis, test, dialyzer, container-security]
    if: needs.tested.outputs.skip != 'true'
    steps:
      - run: echo "${{ needs.tested.outputs.tree }}" > tested-tree.txt

      - uses: actions/upload-artifact@v7
        with:
          name: tested-tree-${{ needs.tested.outputs.tree }}
          path: tested-tree.txt
          retention-days: 30
