# ============================================
# Deploy to Staging: build with cache and push to container registry
# Runs on: push to develop
# ============================================

name: Deploy to Staging

on:
  # Run workflow (Actions tab) redeploys without a code change
  workflow_dispatch:
  push:
    branches: [develop]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "sdks/**"
      - "scripts/**"
      - "k6/**"
      - "LICENSE"
      - "VERSION"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release-sdks.yml"
      - ".github/workflows/release.yml"
      # CI-only workflows: they do not change the deployed app
      - ".github/workflows/ci-cache.yml"
      - ".github/workflows/sdk-catalog.yml"

env:
  ACR_NAME: ${{ secrets.AZURE_ACR_NAME }}
  IMAGE_NAME: jobscelis
  IMAGE_TAG: staging
  WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_STAGING }}
  RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The image is also tagged with the git tree it was built from, so the
      # production deploy can promote this exact image instead of rebuilding it
      - name: Tree being deployed
        id: tree
        run: echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:tree-${{ steps.tree.outputs.tree }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keep only the 5 newest tree-* images so the registry does not grow
      - name: Remove old tree images
        continue-on-error: true
        run: |
          az acr repository show-tags --name "$ACR_NAME" --repository "$IMAGE_NAME" \
            --orderby time_desc --output tsv \
            | grep '^tree-' | tail -n +6 \
            | while read -r tag; do
                az acr repository delete --name "$ACR_NAME" --image "$IMAGE_NAME:$tag" --yes
              done

      - name: Restart Staging Web App
        run: az webapp restart --name ${{ env.WEBAPP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }}

      - name: Logout Azure
        if: always()
        run: az logout
