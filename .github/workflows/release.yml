# Releases the platform automatically on every push to main:
#   1. next-version (jobcelis-team/.github) picks the version: the last vX.Y.Z
#      tag plus a patch when the platform code changed since, or the version in
#      VERSION when it was raised by hand above the last release
#   2. tags the commit and creates the GitHub Release with the commits since the
#      previous release
# Docs, tests, CI and the SDKs in sdks/ (released by release-sdks.yml as
# node-v*, cli-v*, python-v*) release nothing. main is protected, so the
# version lives in the tags; VERSION is only raised by hand for a minor or
# major release. Pushing a vX.Y.Z tag by hand still works.
name: Create Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version in VERSION
        id: current
        if: github.ref_type != 'tag'
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Next version
        id: next
        if: github.ref_type != 'tag'
        uses: jobcelis-team/.github/actions/next-version@main
        with:
          current: ${{ steps.current.outputs.version }}
        env:
          # The default ignore list, plus the SDKs (they release themselves)
          IGNORE: '(^|/)(README|CHANGELOG|CONTRIBUTING|CODE_OF_CONDUCT|SECURITY|LICENSE|VERSION)[^/]*$|\.md$|(^|/)\.(gitignore|gitattributes|editorconfig|github/)|(^|/)(tests?|spec|docs|examples?)/|^sdks/'

      - name: Which release?
        id: v
        env:
          NEXT_TAG: ${{ steps.next.outputs.tag }}
          NEXT_RELEASE: ${{ steps.next.outputs.release }}
          REASON: ${{ steps.next.outputs.reason }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$REASON"
          echo "tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"
          echo "release=$NEXT_RELEASE" >> "$GITHUB_OUTPUT"

      - name: Tag the release
        if: steps.v.outputs.release == 'true' && github.ref_type != 'tag'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.v.outputs.tag }}" -m "${{ steps.v.outputs.tag }}"
          git push origin "${{ steps.v.outputs.tag }}"

      - name: Generate release notes
        id: notes
        if: steps.v.outputs.release == 'true'
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -1)

          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s" "$TAG")
          else
            COMMITS=$(git log --pretty=format:"- %s" "${PREV_TAG}..${TAG}")
          fi

          {
            echo "notes<<NOTES_EOF"
            echo "## What's Changed"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.v.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: ${{ steps.v.outputs.tag }}
          body: ${{ steps.notes.outputs.notes }}
          generate_release_notes: false
