# ============================================
# Deploy to Production: build with cache and push to container registry
# Runs on: push to main
# ============================================

name: Deploy Production

on:
  # Run workflow (Actions tab) redeploys without a code change
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "sdks/**"
      - "scripts/**"
      - "k6/**"
      - "LICENSE"
      - "VERSION"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release-sdks.yml"
      - ".github/workflows/release.yml"
      # CI-only workflows: they do not change the deployed app
      - ".github/workflows/ci-cache.yml"
      - ".github/workflows/sdk-catalog.yml"

env:
  ACR_NAME: ${{ secrets.AZURE_ACR_NAME }}
  IMAGE_NAME: jobscelis
  IMAGE_TAG: latest
  WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_PRODUCTION }}
  RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # main receives develop through a pull request, so its tree is normally
      # the one staging already built and ran. That image is promoted as is
      # (a registry-side copy, no build); otherwise the image is built here.
      - name: Image built by staging?
        id: staged
        run: |
          TREE=$(git rev-parse HEAD^{tree})
          SOURCE="$ACR_NAME.azurecr.io/$IMAGE_NAME:tree-$TREE"
          if docker buildx imagetools inspect "$SOURCE" >/dev/null 2>&1; then
            echo "Promoting the staging image for tree $TREE"
            echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          else
            echo "No staging image for tree $TREE: building"
          fi

      - name: Promote staging image
        if: steps.staged.outputs.source != ''
        run: docker buildx imagetools create --tag "$ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG" "${{ steps.staged.outputs.source }}"

      - name: Build and push image
        if: steps.staged.outputs.source == ''
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          push: true
          tags: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Restart Web App
        run: az webapp restart --name ${{ env.WEBAPP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }}

      - name: Logout Azure
        if: always()
        run: az logout
